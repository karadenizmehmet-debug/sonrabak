<style>
:root{
  --bg:#f5f3ee;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e4e1da;
  --acc:#e2572b;--acc2:#fde8df;--ok:#2f8f5b;--chip:#efece6;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
body.dark{
  --bg:#141416;--card:#1f1f23;--ink:#f2f2f4;--muted:#9a9aa3;--line:#2e2e34;
  --acc:#ff7a4d;--acc2:#3a2219;--ok:#5cc58a;--chip:#2a2a30;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px;display:flex;align-items:baseline;gap:6px;flex:1;min-width:0}
.logo span.dot{color:var(--acc)}
.ver{font-size:11px;font-weight:600;color:var(--muted);background:var(--chip);padding:2px 6px;border-radius:6px}
.hbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--card);box-shadow:var(--shadow)}
.hbtn:active{transform:scale(.95)}
main{max-width:720px;margin:0 auto;padding:12px 14px 110px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.add textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);resize:none;min-height:52px;outline:none}
.add textarea:focus,.field:focus{border-color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);outline:none;min-width:0}
.more{display:none;margin-top:8px;gap:8px;flex-direction:column}
.more.open{display:flex}
.btn{padding:10px 16px;border-radius:11px;font-weight:650;background:var(--chip)}
.btn.pri{background:var(--acc);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.lnk{color:var(--acc);font-weight:600;font-size:13px}
.search{margin:14px 0 10px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);outline:none}
.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.clist{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.crow2{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
.crow2:last-child{border-bottom:0}
.crow2:active{background:var(--chip)}
.crow2 .e{font-size:22px;width:30px;text-align:center;flex:none}
.crow2 .n{flex:1;min-width:0}
.crow2 .n b{display:block;font-weight:650}
.crow2 .n small{color:var(--muted);font-size:12.5px}
.crow2 .cnt{color:var(--muted);font-weight:700;font-size:13px;background:var(--chip);border-radius:999px;padding:2px 9px}
.crow2 .ch{color:var(--muted);font-size:18px}
.crumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:2px 2px 10px;font-size:14px}
.crumb button{color:var(--acc);font-weight:600;padding:2px 4px}
.crumb span{color:var(--muted)}
.chead{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.chead .e{font-size:30px}
.chead h1{font-size:22px;margin:0;flex:1;min-width:0;word-break:break-word}
.tree .opt{padding:9px 10px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 8px}
.sec h2{font-size:15px;margin:0;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.filters{display:flex;gap:6px}
.f{font-size:12px;padding:4px 9px;border-radius:8px;background:var(--chip);font-weight:600}
.f.on{background:var(--acc2);color:var(--acc)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 10px;display:flex;gap:11px}
.item.read{opacity:.62}
.pf{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;color:#fff;font-weight:800}
.body{flex:1;min-width:0}
.t{font-weight:650;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:inherit;text-decoration:none}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tur{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--acc);margin-bottom:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--acc2);color:var(--acc);font-weight:600}
.sum{cursor:pointer}
.sum.open{-webkit-line-clamp:unset;display:block}
.sum:not(.open)::after{content:""}
.tag.more{background:var(--chip);color:var(--muted)}
.sum.ai{color:var(--ink);opacity:.85}
.sum{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{font-size:13.5px;margin-top:5px;background:var(--bg);border-radius:8px;padding:6px 8px;white-space:pre-wrap;word-break:break-word}
.chipb{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);font-weight:600}
.acts{display:flex;gap:2px;margin-top:6px;margin-left:-6px}
.ib{padding:5px 8px;border-radius:8px;font-size:15px}
.ib:active{background:var(--chip)}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty .big{font-size:40px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;visibility:hidden;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:opacity .2s,transform .2s,visibility 0s .2s;z-index:60;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto;visibility:visible;transition:opacity .2s,transform .2s}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:16px 16px 26px;max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:18px}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;border-radius:10px;text-align:left;font-weight:600}
.opt:active,.opt.on{background:var(--chip)}
.crow{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crow input.em{width:46px;text-align:center}
.crow input.nm{flex:1}
.kw{width:100%;font-size:13px;margin-top:4px}
.stat{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
label.tg{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<header>
  <div class="logo">Sonra Bak<span class="dot">.</span><span class="ver">v1.5.2</span></div>
  <button class="hbtn" id="btnCats" title="Kategorileri düzenle">🗂️</button>
  <button class="hbtn" id="btnTheme" title="Gece / gündüz">🌙</button>
  <button class="hbtn" id="btnShare" title="Paylaş">📤</button>
</header>

<main>
  <section class="card add">
    <textarea id="inUrl" rows="2" placeholder="Linki veya metni buraya yapıştır (Instagram, YouTube, site…)"></textarea>
    <div class="more" id="more">
      <input class="field" id="inTitle" placeholder="Başlık (boş bırakırsan otomatik)">
      <textarea class="field" id="inNote" rows="2" placeholder="Not: neden kaydettin?"></textarea>
    </div>
    <div class="row" style="margin-top:8px">
      <select class="field" id="inCat" style="flex:1"></select>
      <button class="btn" id="btnMore" title="Başlık / not ekle">✏️</button>
      <button class="btn pri" id="btnSave">Kaydet</button>
    </div>
    <div class="row" style="margin-top:8px;justify-content:space-between">
      <button class="tg lnk" id="aiWrap" style="color:var(--muted)">🤖 Akıllı kategori: <b id="aiState">Kapalı</b> · <span style="color:var(--acc)">Ayarla</span></button>
      <span class="badge" id="syncBadge">⏳ Bağlanıyor…</span>
    </div>
  </section>

  <div class="search"><input id="q" type="search" placeholder="Ara: başlık, etiket, özet…"></div>

  <div id="nav"></div>

  <div class="sec">
    <h2 id="listTitle">Son kaydedilenler</h2>
    <div class="filters">
      <button class="f on" data-f="all">Tümü</button>
      <button class="f" data-f="unread">Bakılmadı</button>
      <button class="f" data-f="fav">⭐</button>
    </div>
  </div>
  <div class="list" id="list"></div>

  <div class="stat" id="stat"></div>
  <div class="row" style="justify-content:center;margin-top:10px;gap:14px">
    <button class="lnk" id="btnExport">Yedek indir</button>
    <button class="lnk" id="btnImport">Yedek yükle</button>
  </div>
  <footer>© Mehmet Karadeniz, 2026-2027</footer>
</main>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
const VERSION = "1.5.2";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid8 = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const trLower = s => String(s || "").toLocaleLowerCase("tr");
// Türkçe karakterleri sadeleştir: "akıllı-tahta" ile "akilli tahta" eşleşsin
const fold = s => trLower(s).replace(/[ıİ]/g, "i").replace(/ş/g, "s").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ö/g, "o").replace(/ç/g, "c").replace(/[â]/g, "a").replace(/[-_+\/.'’"“”()\[\]:;,!?#]+/g, " ").replace(/\s+/g, " ");

/* ---------- Varsayılan kategoriler (parent = üst kategori id) ---------- */
const DEFAULT_CATS = [
  {id:"okul",     emoji:"🏫", name:"Okul",               parent:null, kw:"okul,meb,eba,e-okul,mebbis,öğretmen,öğrenci,veli,müdür,nöbet,zümre"},
  {id:"tahta",    emoji:"🖥️", name:"Etkileşimli Tahta",  parent:"okul", kw:"etkileşimli tahta,akıllı tahta,etahta,e-tahta,board,dokunmatik,tahta kilidi"},
  {id:"pardus",   emoji:"🐧", name:"Pardus",             parent:"okul", kw:"pardus,etap,debian,linux,terminal,sudo,apt"},
  {id:"egitim",   emoji:"📝", name:"Ders Materyali",     parent:"okul", kw:"eğitim,ders,etkinlik,çalışma kağıdı,föy,sınav,soru,test,müfredat,maarif,lgs,kazanım,ünite"},
  {id:"teknoloji",emoji:"💻", name:"Yazılım & Teknoloji", parent:null, kw:"github,kod,yazılım,python,javascript,react,html,css,api,firebase,programlama,developer,stackoverflow"},
  {id:"yz",       emoji:"🤖", name:"Yapay Zekâ",         parent:"teknoloji", kw:"yapay zeka,yapay zekâ,ai,claude,chatgpt,gemini,prompt,llm"},
  {id:"uygulama", emoji:"📱", name:"Uygulamalar",        parent:"teknoloji", kw:"uygulama,app,apk,android,ios,play store"},
  {id:"bakim",    emoji:"🔧", name:"Bakım & Tamir",      parent:null, kw:"bakım,tamir,onarım,arıza,değişimi,nasıl değiştirilir,kendin yap,diy"},
  {id:"arac",     emoji:"🚗", name:"Araç Bakım",         parent:"bakim", kw:"araba,araç,otomobil,motor,yağ değişimi,lastik,fren,akü,egzoz,triger"},
  {id:"ev",       emoji:"🏠", name:"Ev",                 parent:"bakim", kw:"tesisat,musluk,priz,boya,duvar,kombi,elektrik,sızıntı"},
  {id:"yemek",    emoji:"🍲", name:"Yemek & Tarif",      parent:null, kw:"tarif,yemek,tatlı,çorba,mutfak,pasta,kek,börek,recipe,lezzet"},
  {id:"okuma",    emoji:"📖", name:"Makale & Okuma",     parent:null, kw:"makale,blog,yazı,medium,substack,kitap,okuma,röportaj,inceleme,wikipedia"},
  {id:"video",    emoji:"🎬", name:"Video",              parent:null, kw:""},
  {id:"saglik",   emoji:"💪", name:"Sağlık & Spor",      parent:null, kw:"sağlık,spor,egzersiz,diyet,fitness,yürüyüş,koşu,beslenme,uyku,antrenman"},
  {id:"alisveris",emoji:"🛒", name:"Alışveriş",          parent:null, kw:"trendyol,hepsiburada,amazon,n11,ürün,fiyat,indirim,satın,sepet,kampanya,aliexpress,temu"},
  {id:"haber",    emoji:"📰", name:"Haber",              parent:null, kw:"haber,son dakika,gündem,hurriyet,sozcu,ntv,cnnturk,bbc,milliyet,sabah,aa.com.tr,habertürk"},
  {id:"ilham",    emoji:"✨", name:"İlham & Fikir",      parent:null, kw:"fikir,ilham,tasarım,design,dekorasyon,pinterest,dribbble,behance"},
  {id:"diger",    emoji:"📦", name:"Diğer",              parent:null, kw:""}
];

/* ---------- Platform tespiti ---------- */
const PLATFORMS = [
  {k:"youtube",  re:/(youtube\.com|youtu\.be)/i, label:"YouTube",   ic:"▶", bg:"#ff0033", cat:"video"},
  {k:"instagram",re:/instagram\.com/i,           label:"Instagram", ic:"◎", bg:"linear-gradient(135deg,#f9a03f,#e1306c,#833ab4)", cat:null},
  {k:"tiktok",   re:/tiktok\.com/i,              label:"TikTok",    ic:"♪", bg:"#111", cat:"video"},
  {k:"x",        re:/(twitter\.com|\/\/x\.com|\.x\.com)/i, label:"X", ic:"𝕏", bg:"#000", cat:"haber"},
  {k:"facebook", re:/(facebook\.com|fb\.watch)/i,label:"Facebook",  ic:"f", bg:"#1877f2", cat:null},
  {k:"linkedin", re:/linkedin\.com/i,            label:"LinkedIn",  ic:"in", bg:"#0a66c2", cat:"teknoloji"},
  {k:"github",   re:/github\.(com|io)/i,         label:"GitHub",    ic:"⌥", bg:"#24292f", cat:"teknoloji"},
  {k:"reddit",   re:/reddit\.com/i,              label:"Reddit",    ic:"●", bg:"#ff4500", cat:null},
  {k:"pinterest",re:/(pinterest\.|pin\.it)/i,    label:"Pinterest", ic:"P", bg:"#e60023", cat:"ilham"},
  {k:"spotify",  re:/spotify\.com/i,             label:"Spotify",   ic:"♫", bg:"#1db954", cat:null},
  {k:"web",      re:/^https?:\/\//i,             label:"Web",       ic:"🌐", bg:"#5b6b7c", cat:null},
  {k:"text",     re:/.*/,                        label:"Not",       ic:"✎", bg:"#a07a3a", cat:null}
];
const platformOf = url => PLATFORMS.find(p => p.re.test(url || "")) || PLATFORMS[PLATFORMS.length - 1];
const pByKey = k => PLATFORMS.find(p => p.k === k) || PLATFORMS[PLATFORMS.length - 1];

function extractUrl(text) {
  const m = String(text || "").match(/https?:\/\/[^\s<>"']+/i);
  return m ? m[0].replace(/[),.;!?]+$/, "") : "";
}
function domainOf(url) {
  try { return new URL(url).hostname.replace(/^www\.|^m\./, ""); } catch { return ""; }
}
function guessTitle(url, text) {
  const rest = String(text || "").replace(url, "").trim();
  if (rest) return rest.split("\n")[0].slice(0, 140);
  if (!url) return "";
  try {
    const u = new URL(url);
    const p = platformOf(url);
    const parts = u.pathname.split("/").filter(Boolean);
    if (p.k === "youtube") return parts[0] === "shorts" ? "YouTube Shorts" : "YouTube videosu";
    if (p.k === "instagram") return parts[0] === "reel" || parts[0] === "reels" ? "Instagram Reels" : parts[0] === "p" ? "Instagram gönderisi" : "Instagram: @" + (parts[0] || "");
    if (p.k === "tiktok") return "TikTok videosu" + (parts[0] && parts[0].startsWith("@") ? " · " + parts[0] : "");
    if (p.k === "github" && parts.length >= 2) return "GitHub · " + parts[0] + "/" + parts[1];
    const slug = decodeURIComponent(parts[parts.length - 1] || "").replace(/\.(html?|php|aspx?)$/i, "").replace(/[-_+]+/g, " ").replace(/\b\d{5,}\b/g, "").trim();
    if (slug.length > 5 && /[a-zçğıöşü]/i.test(slug)) return slug.charAt(0).toLocaleUpperCase("tr") + slug.slice(1);
    return domainOf(url);
  } catch { return text.slice(0, 140); }
}

/* ---------- Durum ---------- */
const S = { items: [], cats: DEFAULT_CATS.map(c => ({...c})), sel: "home", filter: "all", q: "", mode: "local" };
let db = null, uidv = null, itemsCol = null, catsDoc = null, sample = null;

const LS = {
  get(k, d) { try { const v = localStorage.getItem("sonrabak_" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("sonrabak_" + k, JSON.stringify(v)); } catch {} }
};

/* ---------- Kategori ağacı yardımcıları ---------- */
const catById = id => S.cats.find(c => c.id === id) || { id, emoji: "📁", name: "Kategorisiz", parent: null };
const childrenOf = pid => S.cats.filter(c => (c.parent || null) === (pid || null));
function ancestors(id) {
  const out = []; let c = S.cats.find(x => x.id === id); let guard = 0;
  while (c && guard++ < 10) { out.unshift(c); c = c.parent ? S.cats.find(x => x.id === c.parent) : null; }
  return out;
}
const pathName = id => ancestors(id).map(c => c.name).join(" › ") || catById(id).name;
function descendantIds(id) {
  const out = new Set([id]); let added = true;
  while (added) { added = false; for (const c of S.cats) if (c.parent && out.has(c.parent) && !out.has(c.id)) { out.add(c.id); added = true; } }
  return out;
}
const depthOf = id => ancestors(id).length;
function treeOrder(pid = null, depth = 0, out = []) {
  for (const c of childrenOf(pid)) { out.push({ c, depth }); if (depth < 6) treeOrder(c.id, depth + 1, out); }
  return out;
}
function countIn(id) { const ids = descendantIds(id); return S.items.filter(i => ids.has(i.cat)).length; }
function fixCats(list) {
  // eksik/yanlış parent'ları düzelt, döngüleri kır
  const ids = new Set(list.map(c => c.id));
  for (const c of list) { if (!c.parent || !ids.has(c.parent) || c.parent === c.id) c.parent = null; }
  for (const c of list) {
    let p = c.parent, seen = new Set([c.id]);
    while (p) { if (seen.has(p)) { c.parent = null; break; } seen.add(p); p = (list.find(x => x.id === p) || {}).parent; }
  }
  return list;
}

/* ---------- Kural tabanlı kategori ---------- */
// Yalnızca bir kategorinin alt kategorileri arasında anahtar kelimeyle seç (bulamazsa null)
function ruleWithin(item, parentId) {
  const ids = descendantIds(parentId); ids.delete(parentId);
  const hay = " " + fold([item.url, item.title, item.ozet, (item.tags || []).join(" "), item.desc, item.note].join(" ")) + " ";
  let best = null, bestScore = 0;
  for (const c of S.cats) {
    if (!ids.has(c.id)) continue;
    let score = 0;
    for (const k of (c.kw || "").split(",").map(x => fold(x.trim()).trim()).filter(Boolean))
      if (k.length <= 3 ? hay.includes(" " + k + " ") : hay.includes(" " + k)) score += k.length > 4 ? 2 : 1;
    const nm = fold(c.name).trim();
    if (nm.length > 2 && hay.includes(" " + nm)) score += 2;
    if (score > bestScore) { bestScore = score; best = c.id; }
  }
  return best;
}
function ruleCategory(item) {
  const hay = " " + fold([item.url, item.title, item.ozet, (item.tags || []).join(" "), item.desc, item.note].join(" ")) + " ";
  let best = null, bestScore = 0;
  for (const c of S.cats) {
    const kws = (c.kw || "").split(",").map(s => fold(s.trim()).trim()).filter(Boolean);
    let score = 0;
    // kelime BAŞINDAN eşleşsin: "tahta" → "tahtada" olur ama "board" → "clipboard" olmaz; kısa kelimeler tam kelime
    for (const k of kws) if (k.length <= 3 ? hay.includes(" " + k + " ") : hay.includes(" " + k)) score += k.length > 4 ? 2 : 1;
    const nm = fold(c.name).trim();
    if (nm.length > 2 && hay.includes(" " + nm)) score += 2;
    if (score > 0) score += depthOf(c.id) * 0.5; // daha özel (alt) kategori öne geçsin
    if (score > bestScore) { bestScore = score; best = c.id; }
  }
  if (best) return best;
  const p = platformOf(item.url);
  if (p.cat && S.cats.some(c => c.id === p.cat)) return p.cat;
  if (S.cats.some(c => c.id === "diger")) return "diger";
  return S.cats[0]?.id || "diger";
}

// v1.2: eski kayıtlı kategorilere yeni varsayılan alt kategorileri bir kez ekle
function upgradeCats(list) {
  if (LS.get("seed12", false)) return list;
  const ids = new Set(list.map(c => c.id));
  for (const d of DEFAULT_CATS) {
    if (ids.has(d.id)) { const c = list.find(x => x.id === d.id); if (c.parent === undefined) c.parent = null; continue; }
    list.push({ ...d });
  }
  LS.set("seed12", true);
  return fixCats(list);
}

function loadLocal() {
  S.mode = "local";
  S.items = LS.get("items", []);
  const c = LS.get("cats", null);
  if (c && c.length) { S.cats = upgradeCats(c.map(x => ({ ...x }))); LS.set("cats", S.cats); }
  else LS.set("seed12", true);
  setBadge("📱 Bu cihazda saklanıyor");
  render();
}

async function initCloud() {
  if (!window.claude || !window.claude.use) { loadLocal(); return; }
  try {
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d || !u) { loadLocal(); return; }
    const id = await u.id();
    if (!id) { loadLocal(); return; }
    db = d; uidv = id;
    itemsCol = db.doc("data/users/" + uidv + "/meta").collection("items");
    catsDoc = db.doc("data/users/" + uidv + "/cats");
    S.mode = "cloud";
    setBadge("⏳ Yükleniyor…");
    const timer = setTimeout(() => setBadge("⚠️ Bağlantı yavaş, bekleniyor…"), 10000);
    catsDoc.onSnapshot(snap => {
      if (snap.exists) { const l = snap.data().list; if (Array.isArray(l) && l.length) S.cats = fixCats(l.map(c => ({...c}))); }
      render();
    }, () => {});
    itemsCol.onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); setBadge("☁️ Hesabında saklanıyor"); }
      S.items = snap.docs.map(d => d.data()).filter(Boolean).sort((a, b) => (b.created || 0) - (a.created || 0));
      render();
    }, () => { clearTimeout(timer); setBadge("⚠️ Bulut erişimi yok"); });
  } catch { loadLocal(); }
}

function parseJsonLoose(text) {
  const m = String(text || "").match(/\{[\s\S]*\}/);
  if (!m) throw new Error("JSON yok");
  return JSON.parse(m[0]);
}

// İstek başına ayrı süre sınırı
async function fetchT(url, opts, ms) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, { ...opts, signal: ctl.signal }); }
  catch (e) { if (e.name === "AbortError") { const x = new Error("Zaman aşımı"); x.timeout = true; throw x; } throw e; }
  finally { clearTimeout(to); }
}
async function callProvider(conf, prompt, { web = false } = {}) {
  try {
    if (conf.provider === "gemini") {
      let model = conf.model || MODEL_DEF.gemini;
      const ask = async useWeb => {
        // useWeb: Gemini linkteki sayfayı kendisi açıp okur (url_context). Bu modda JSON modu kullanılamıyor.
        const body = useWeb
          ? { contents: [{ parts: [{ text: prompt }] }], tools: [{ url_context: {} }], generationConfig: { temperature: 0.2 } }
          : { contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", temperature: 0.2 } };
        const r = await fetchT(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
          method: "POST",
          headers: { "content-type": "application/json", "x-goog-api-key": conf.key },
          body: JSON.stringify(body)
        }, useWeb ? 15000 : 20000);
        const j = await r.json().catch(() => ({}));
        if (!r.ok) { const e = new Error(j.error?.message || "Gemini hata " + r.status); e.status = r.status; throw e; }
        return parseJsonLoose(j.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "");
      };
      const once = async () => {
        if (!web) return await ask(false);
        try { return await ask(true); }
        catch (e) { if (e.status === 429 || e.status === 401 || e.status === 403 || e.status === 404) throw e; return await ask(false); } // sayfa okuma yavaşsa/hatalıysa okumadan dene
      };
      // önce en son çalışan model, sonra yazılan model, sonra yedekler
      const order = [...new Set([geminiWorking, model, ...GEMINI_FALLBACK].filter(Boolean))];
      let lastErr, tries = 0;
      for (const m of order) {
        if (++tries > 3) break; // en fazla 3 model dene, kullanıcı çok beklemesin
        model = m;
        try {
          const out = await once();
          if (geminiWorking !== m) { geminiWorking = m; LS.set("geminiWorking", m); }
          return out;
        } catch (e) {
          lastErr = e;
          const msg = String(e.message || "");
          const modelProblem = e.timeout || e.status === 404 || e.status === 429 || e.status >= 500 || /not found|not supported|is not available|quota|exhausted|deprecated|shut down|overloaded/i.test(msg);
          if (!modelProblem) throw e; // anahtar hatası vb.: başka model denemek boşuna
        }
      }
      throw lastErr;
    }
    if (conf.provider === "claude") {
      const r = await fetchT("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "content-type": "application/json", "x-api-key": conf.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: conf.model || MODEL_DEF.claude, max_tokens: 300, messages: [{ role: "user", content: prompt }] })
      }, 25000);
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error?.message || "Claude hata " + r.status);
      return parseJsonLoose((j.content || []).map(c => c.text || "").join(""));
    }
    return null;
  } catch (e) {
    throw e;
  }
}

/* ---------- Sayfa bilgisi (başlık/açıklama) ---------- */
async function getJson(u, ms) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(u, { signal: ctl.signal }); return r.ok ? await r.json() : null; }
  catch { return null; } finally { clearTimeout(to); }
}
// YouTube/Vimeo: noembed · diğer siteler (Instagram dahil): microlink (ücretsiz, günde ~50 istek)
async function fetchMeta(url) {
  if (!url) return null;
  if (/(youtube\.com|youtu\.be|vimeo\.com|dailymotion\.com|soundcloud\.com|flickr\.com)/i.test(url)) {
    const j = await getJson("https://noembed.com/embed?url=" + encodeURIComponent(url), 5000);
    if (j && j.title) return { title: String(j.title), desc: "", author: String(j.author_name || "") };
  }
  const m = await getJson("https://api.microlink.io/?url=" + encodeURIComponent(url), 7000);
  const d = m && m.status === "success" ? m.data || {} : null;
  if (d && (d.title || d.description)) return { title: String(d.title || ""), desc: String(d.description || "").slice(0, 400), author: String(d.author || d.publisher || "") };
  return null;
}
// Sayfanın düz metni: yapay zekâ başlığa değil içeriğe baksın diye (r.jina.ai, ücretsiz okuyucu)
async function fetchPageText(url) {
  if (!url || /(youtube\.com|youtu\.be)/i.test(url)) return "";
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 10000);
  try {
    const r = await fetch("https://r.jina.ai/" + url, { signal: ctl.signal, headers: { "x-return-format": "text" } });
    if (!r.ok) return "";
    return (await r.text()).replace(/\s+/g, " ").trim().slice(0, 3500);
  } catch { return ""; } finally { clearTimeout(to); }
}

function isGenericTitle(title, url) {
  const t = String(title || "").trim();
  if (!t) return true;
  if (/^(https?:|www\.)/i.test(t)) return true;
  if (url && (t === domainOf(url) || t === url)) return true;
  if (/^(YouTube videosu|YouTube Shorts|Instagram (Reels|gönderisi)|Instagram: @|TikTok videosu|GitHub · )/i.test(t)) return true;
  if (!/\s/.test(t) && /\.[a-z]{2,}/i.test(t)) return true;
  if (/^(instagram|youtube|tiktok|facebook|x|twitter)$/i.test(t)) return true;
  return false;
}

- Yeni adlar 1-3 kelimelik, Türkçe, baş harfleri büyük olsun. "Diğer"i yalnızca gerçekten hiçbir şey çıkarılamıyorsa seç.
- "emoji": yeni açılan en son kategori için uygun tek emoji.`
: `- Yalnızca mevcut kategorilerden seç, yeni kategori açma. Hiçbiri uymuyorsa ["Diğer"] yaz.`}
${titleRules}`;
  try {
    if (useSample) {
      const r = await sample.json(prompt, { modelTier: "quick" });
      return r && typeof r === "object" ? r : null;
    }
    lastAiError = "";
    return await callProvider(AI, prompt, { web });
  } catch (e) {
    lastAiError = e?.message || e?.code || "hata";
    if (e && e.code === "not_granted") { sample = null; refreshAiState(); }
    return null;
  }
}

// ["Okul","Pardus"] yolunu bul; yoksa (izin varsa) oluştur. {id, created:[...]} döner
function resolvePath(names, emoji, allowNew) {
  let parent = null, id = null; const created = [];
  const clean = (Array.isArray(names) ? names : [names]).map(n => String(n || "").trim()).filter(Boolean).slice(0, 2);
  for (let i = 0; i < clean.length; i++) {
    const nm = clean[i];
    const same = x => fold(x.name).trim() === fold(nm).trim();
    let c = childrenOf(parent).find(same);
    if (!c && parent === null && i === clean.length - 1) c = S.cats.find(same); // tek ad verildiyse her yerde ara
    if (!c) {
      if (!allowNew) break;
      c = { id: "c" + uid8(), emoji: i === clean.length - 1 ? (String(emoji || "📁").slice(0, 4) || "📁") : "📁", name: nm.slice(0, 30), parent, kw: "" };
      if (parent === null) { const di = S.cats.findIndex(x => x.id === "diger"); S.cats.splice(di >= 0 ? di : S.cats.length, 0, c); }
      else S.cats.push(c);
      created.push(c);
    }
    parent = c.id; id = c.id;
  }
  return { id, created };
}

function cleanTags(arr) {
  const out = [];
  for (const t of arr || []) {
    const v = trLower(String(t || "")).replace(/^#/, "").replace(/\s+/g, " ").trim().slice(0, 30);
    if (v && !out.includes(v)) out.push(v);
  }
  return out.slice(0, 12);
}

/* ---------- Kaydı zenginleştir: sayfa bilgisi + içerik + yapay zekâ ---------- */
// recat: kategoriyi de yapay zekâ seçsin mi · userTitle: kullanıcı başlık yazdıysa dokunma
async function enrich(it, { recat = false, userTitle = "", userText = "" } = {}) {
  const url = it.url;
  const meta = url ? await fetchMeta(url) : null;
  if (meta) {
    if (!userTitle && meta.title && !isGenericTitle(meta.title, url) && (!it.ai || isGenericTitle(it.title, url))) it.title = meta.title.slice(0, 160);
    if (meta.desc) it.desc = meta.desc;
    if (meta.author) it.author = meta.author;
  }
  let catMsg = "", aiOk = false;
  if (hasAI()) {
    const pageText = url ? await fetchPageText(url) : "";
    const base = { ...it, title: userText || (isGenericTitle(it.title, url) ? "" : it.title) };
    const ai = await aiCategorize(base, meta, { titleOnly: !recat, pageText });
    if (ai) {
      aiOk = true; it.ai = true;
      if (!userTitle && ai.baslik && String(ai.baslik).length > 3 && !isGenericTitle(ai.baslik, url)) it.title = String(ai.baslik).slice(0, 160);
      if (ai.ozet) it.ozet = String(ai.ozet).slice(0, 200);
      if (ai.tur) it.tur = String(ai.tur).slice(0, 24);
      if (Array.isArray(ai.etiketler)) it.tags = cleanTags(ai.etiketler);
      if (recat && (ai.yol || ai.kategori)) {
        const useSample = sample && AI.provider === "off";
        const r = resolvePath(ai.yol || [ai.kategori], ai.emoji, useSample || AI.newCats !== false);
        if (r.id) {
          it.cat = r.id; it.auto = true;
          if (childrenOf(r.id).length) { const sub = ruleWithin(it, r.id); if (sub) it.cat = sub; }
        }
        if (r.created.length) { await saveCats(); catMsg = " · yeni: " + r.created.map(c => c.name).join(" › "); }
      }
    }
  }
  if (recat && !aiOk) { it.cat = ruleCategory(it); it.auto = true; }
  return { it, catMsg, aiOk };
}

// Kaydı arkada düzenle; bu sırada kullanıcı başka kayıt ekleyebilir
async function enrichInBackground(orig, opts) {
  const copy = { ...orig }; delete copy.pending;
  let res;
  try { res = await enrich(copy, opts); } catch { res = { catMsg: "", aiOk: false }; }
  const cur = S.items.find(x => x.id === orig.id);
  if (!cur) return; // bu arada silindi
  const merged = { ...cur, title: copy.title, ozet: copy.ozet, tur: copy.tur, tags: copy.tags, desc: copy.desc, author: copy.author, ai: copy.ai };
  // kullanıcı bu arada kategoriyi elle değiştirdiyse ona dokunma
  if (cur.cat === orig.cat) { merged.cat = copy.cat; merged.auto = copy.auto; }
  delete merged.pending;
  for (const k of Object.keys(merged)) if (merged[k] === undefined) delete merged[k];
  try { await saveItem(merged); } catch { return; }
  const c = catById(merged.cat);
  const warn = hasAI() && !res.aiOk ? " · ⚠️ yapay zekâ: " + (lastAiError || "cevap yok").slice(0, 40) : "";
  toast(`${c.emoji} ${pathName(merged.cat)}${res.catMsg}${warn}`);
}

/* ---------- Başlık önerisi (mevcut kayıtlar için) ---------- */
async function suggestTitle(it, { recat = false } = {}) {
  const copy = { ...it };
  const { aiOk } = await enrich(copy, { recat });
  return !isGenericTitle(copy.title, copy.url) || aiOk ? { title: copy.title, ozet: copy.ozet || "", desc: copy.desc || "", tur: copy.tur || "", tags: copy.tags || [], cat: aiOk && recat ? copy.cat : null } : null;
}
const needsAI = i => (!i.ai || !(i.tags && i.tags.length)) && (i.url || i.note);
async function reprocessAll(btn) {
  const list = S.items.filter(needsAI);
  if (!list.length) { toast("Düzenlenecek kayıt yok"); return; }
  let ok = 0;
  for (let k = 0; k < list.length; k++) {
    if (btn) btn.textContent = `Düzenleniyor ${k + 1}/${list.length}…`;
    const cur = S.items.find(x => x.id === list[k].id); if (!cur) continue;
    const copy = { ...cur };
    // elle seçilmiş kategoriye dokunma, yalnızca otomatik olanları yeniden kategorile
    const { aiOk } = await enrich(copy, { recat: !!cur.auto });
    if (aiOk) { try { await saveItem(copy); ok++; } catch {} }
    else if (lastAiError && /quota|exhausted|429/i.test(lastAiError)) { toast("Kota doldu, kalanlar sonra yapılabilir"); break; }
    await new Promise(res => setTimeout(res, 2500)); // dakikalık kotaya takılmamak için
  }
  if (btn) btn.textContent = "Bitti";
  toast(`${ok}/${list.length} kayıt düzenlendi`);
}

/* ---------- Düzeltmelerden öğren ---------- */
const STOP = new Set("ve,ile,için,bir,bu,şu,çok,daha,gibi,olan,nasıl,neden,video,videosu,gönderisi,instagram,youtube,reels,shorts,tiktok,https,http,www,com,the,and,for,with,you,your,from,this,that".split(","));
async function learnFrom(it, catId) {
  const c = S.cats.find(x => x.id === catId); if (!c) return;
  const have = new Set((c.kw || "").split(",").map(k => trLower(k.trim())).filter(Boolean));
  const add = [];
  const dom = domainOf(it.url);
  if (dom && pByKey(it.platform).k === "web" && !have.has(dom)) add.push(dom);
  const words = trLower([it.title, it.note].join(" ")).replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/)
    .filter(w => w.length >= 5 && !STOP.has(w) && !/^\d+$/.test(w) && !have.has(w));
  for (const w of words) { if (add.length >= 3) break; if (!add.includes(w)) add.push(w); }
  if (!add.length) return;
  c.kw = [...have, ...add].slice(-60).join(",");
  try { await saveCats(); } catch {}
}

function go(sel) {
  const h = sel === "home" ? "" : "#" + (sel === "all" ? "tumu" : "k-" + sel);
  if (location.hash !== h) {
    if (h) location.hash = h; else history.pushState(null, "", location.pathname + location.search);
  }
  applyHash();
}
function applyHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  S.sel = h === "tumu" ? "all" : h.startsWith("k-") && S.cats.some(c => c.id === h.slice(2)) ? h.slice(2) : "home";

}

/* ---------- Görünüm ---------- */
function fmtDate(ts) {
  const d = new Date(ts), now = new Date();
  const diff = (now - d) / 86400000;
  if (diff < 1 && d.getDate() === now.getDate()) return "Bugün " + d.toLocaleTimeString("tr", { hour: "2-digit", minute: "2-digit" });
  if (diff < 2) return "Dün";
  return d.toLocaleDateString("tr", { day: "numeric", month: "short", year: d.getFullYear() === now.getFullYear() ? undefined : "numeric" });
}

function catOptions(selected, { auto = false, none = false, exclude = null } = {}) {
  const ex = exclude ? descendantIds(exclude) : new Set();
  return (auto ? `<option value="__auto">🤖 Otomatik kategori</option>` : "") +
    (none ? `<option value="">— Üst kategori yok (ana kategori)</option>` : "") +
    treeOrder().filter(({ c }) => !ex.has(c.id)).map(({ c, depth }) =>
      `<option value="${esc(c.id)}" ${c.id === selected ? "selected" : ""}>${"    ".repeat(depth)}${depth ? "└ " : ""}${esc(c.emoji)} ${esc(c.name)}</option>`).join("");
}

function catRow(c) {
  const n = countIn(c.id), subs = childrenOf(c.id);
  const unread = S.items.filter(i => descendantIds(c.id).has(i.cat) && !i.read).length;
  const info = [subs.length ? subs.length + " alt kategori" : "", unread ? unread + " bakılmadı" : ""].filter(Boolean).join(" · ");
  return `<button class="crow2" data-go="${esc(c.id)}">
    <span class="e">${esc(c.emoji)}</span>
    <span class="n"><b>${esc(c.name)}</b>${info ? `<small>${esc(info)}</small>` : ""}</span>
    <span class="cnt">${n}</span><span class="ch">›</span></button>`;
}

function render() {
  if (S.sel !== "home" && S.sel !== "all" && !S.cats.some(c => c.id === S.sel)) S.sel = "home";

  // kaydet kutusundaki seçim
  const sel = $("#inCat"), prev = sel.value || "__auto";
  sel.innerHTML = catOptions(null, { auto: true });
  sel.value = [...sel.options].some(o => o.value === prev) ? prev : "__auto";

  // gezinme alanı
  let nav = "";
  if (!S.q) {
    if (S.sel === "home") {
      nav = `<div class="sec"><h2>Kategoriler</h2><button class="lnk" data-newcat="">＋ Yeni</button></div>
        <div class="clist">${childrenOf(null).map(catRow).join("")}
        <button class="crow2" data-go="all"><span class="e">📚</span><span class="n"><b>Tüm kayıtlar</b></span><span class="cnt">${S.items.length}</span><span class="ch">›</span></button></div>`;
    } else if (S.sel !== "all") {
      const c = catById(S.sel), anc = ancestors(S.sel), subs = childrenOf(S.sel);
      nav = `<div class="crumb"><button data-go="home">🏠 Ana sayfa</button>${anc.slice(0, -1).map(a => `<span>›</span><button data-go="${esc(a.id)}">${esc(a.name)}</button>`).join("")}</div>
        <div class="chead"><span class="e">${esc(c.emoji)}</span><h1>${esc(c.name)}</h1>
          <button class="btn sm" data-editcat="${esc(c.id)}">✏️</button></div>
        <div class="sec"><h2>Alt kategoriler</h2><button class="lnk" data-newcat="${esc(c.id)}">＋ Alt kategori</button></div>
        ${subs.length ? `<div class="clist">${subs.map(catRow).join("")}</div>` : `<p style="color:var(--muted);font-size:13px;margin:0 2px 16px">Alt kategori yok.</p>`}`;
    } else {
      nav = `<div class="crumb"><button data-go="home">🏠 Ana sayfa</button></div>`;
    }
  }
  $("#nav").innerHTML = nav;

  // liste
  let arr = S.items.slice();
  if (S.sel !== "home" && S.sel !== "all") { const ids = descendantIds(S.sel); arr = arr.filter(i => ids.has(i.cat)); }
  if (S.filter === "unread") arr = arr.filter(i => !i.read);
  if (S.filter === "fav") arr = arr.filter(i => i.fav);
  if (S.q) {
    const words = fold(S.q).split(/\s+/).filter(Boolean);
    arr = S.items.filter(i => { const h = fold([i.title, i.tur, (i.tags || []).join(" "), i.ozet, i.desc, i.author, i.note, i.url, pathName(i.cat), pByKey(i.platform).label].join(" ")); return words.every(w => h.includes(w)); });
  }
  const showHome = S.sel === "home" && !S.q;
  if (showHome) arr = arr.slice(0, 15);

  $("#listTitle").textContent = S.q ? `“${S.q}” için ${arr.length} sonuç`
    : showHome ? "Son kaydedilenler"
    : S.sel === "all" ? "Tüm kayıtlar"
    : "Kayıtlar (" + arr.length + ")";

  $("#list").innerHTML = arr.length ? arr.map(itemHTML).join("") :
    `<div class="empty"><div class="big">${S.items.length ? "🔎" : "📥"}</div>${
      S.items.length ? "Burada kayıt yok." : "Henüz kayıt yok.<br>Instagram, YouTube ya da bir sitede <b>Paylaş</b>'a bas,<br>listeden <b>Sonra Bak</b>'ı seç ya da linki kopyalayıp yukarıya yapıştır."}</div>`;

  const unread = S.items.filter(i => !i.read).length;
  $("#stat").textContent = S.items.length ? `${S.items.length} kayıt · ${unread} bakılmadı · ${S.cats.length} kategori` : "";
}

    <div class="body">

      ${titleEl}

      </div>

      ${i.tags && i.tags.length ? (() => { const open = OPEN.has(i.id), show = open ? i.tags : i.tags.slice(0, 5);
        return `<div class="tags">${show.map(t => `<button class="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}${!open && i.tags.length > 5 ? `<button class="tag more" data-more="${esc(i.id)}">+${i.tags.length - 5}</button>` : ""}</div>`; })() : ""}
      ${i.note ? `<div class="note">${esc(i.note)}</div>` : ""}
      <div class="acts">
        <button class="ib" data-act="read" title="Baktım">${i.read ? "↩️" : "✅"}</button>
        <button class="ib" data-act="fav" title="Yıldızla">${i.fav ? "⭐" : "☆"}</button>

        ${safeUrl ? `<button class="ib" data-act="copy" title="Linki kopyala">🔗</button>` : ""}
        <button class="ib" data-act="del" title="Sil">🗑️</button>
      </div>
    </div>
  </div>`;
}

/* ---------- Olaylar ---------- */
document.addEventListener("click", async e => {
  if (e.target.closest("#sheet")) return; // alt sayfa kendi düğmelerini yönetir
  const g = e.target.closest("[data-go]");
  if (g) { S.q = ""; $("#q").value = ""; go(g.dataset.go); return; }
  const nc = e.target.closest("[data-newcat]");
  if (nc) { openCatEdit(null, nc.dataset.newcat || null); return; }
  const ec = e.target.closest("[data-editcat]");
  if (ec) { openCatEdit(ec.dataset.editcat); return; }
  const mo = e.target.closest("[data-more]");
  if (mo) { const id = mo.dataset.more; OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id); render(); return; }
  const tg = e.target.closest("[data-tag]");
  if (tg) { S.q = tg.dataset.tag; $("#q").value = S.q; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  const f = e.target.closest("[data-f]");
  if (f) { S.filter = f.dataset.f; document.querySelectorAll("[data-f]").forEach(b => b.classList.toggle("on", b === f)); render(); return; }
  const op = e.target.closest("[data-open]");
  if (op) {
    const it = S.items.find(x => x.id === op.dataset.open);
    if (it && !it.read) setTimeout(() => saveItem({ ...it, read: true }).catch(() => {}), 400);
    return;
  }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const id = a.closest("[data-id]")?.dataset.id; const it = S.items.find(x => x.id === id);
  if (!it) return;
  const act = a.dataset.act;
  try {
    if (act === "read") await saveItem({ ...it, read: !it.read });
    else if (act === "fav") await saveItem({ ...it, fav: !it.fav });
    else if (act === "cat") openCatPicker(it);
    else if (act === "edit") openEdit(it);
    else if (act === "copy") { try { await navigator.clipboard.writeText(it.url); toast("Link kopyalandı"); } catch { toast("Kopyalanamadı"); } }
    else if (act === "del") openConfirm("Bu kayıt silinsin mi?", async () => { await removeItem(it.id); toast("Silindi"); });
  } catch { toast("İşlem yapılamadı"); }
});

    await saveItem({ ...it, cat: b.dataset.pick, auto: false });
    learnFrom(it, b.dataset.pick);
    toast("Taşındı: " + pathName(b.dataset.pick) + " · bir dahakine hatırlayacak");
  });
  $("#pNew").onclick = () => openCatEdit(null, null, async newId => {
    await saveItem({ ...it, cat: newId, auto: false }); learnFrom(it, newId);
  });
}

function openEdit(it) {
  openSheet(`<h3>Kaydı düzenle</h3>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="row" style="flex-wrap:nowrap"><input class="field" id="eT" value="${esc(it.title)}" placeholder="Başlık" style="flex:1"><button class="btn sm" id="eAI" title="Başlık, özet, etiket ve kategoriyi yapay zekâ yazsın">✨</button></div>
      <input class="field" id="eU" value="${esc(it.url)}" placeholder="Link">
      <textarea class="field" id="eN" rows="3" placeholder="Not">${esc(it.note)}</textarea>
      <input class="field" id="eG" value="${esc((it.tags || []).join(", "))}" placeholder="Etiketler (virgülle): pardus, kablosuz, ekran yansıtma">
      <select class="field" id="eC">${catOptions(it.cat)}</select>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="eX">Vazgeç</button><button class="btn pri" id="eS">Kaydet</button></div>
    </div>`);
  $("#eX").onclick = closeSheet;
  $("#eAI").onclick = async () => {
    const b = $("#eAI"); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    const r = await suggestTitle({ ...it, url: $("#eU").value.trim() }, { recat: true });
    b.disabled = false; b.textContent = "✨";
    if (r) { $("#eT").value = r.title; it.ozet = r.ozet || it.ozet; it.desc = r.desc || it.desc; it.tur = r.tur || it.tur; it.ai = true; if (r.tags.length) $("#eG").value = r.tags.join(", ");
      if (r.cat) { $("#eC").innerHTML = catOptions(r.cat); $("#eC").value = r.cat; if (r.cat !== it.cat) toast("Önerilen kategori: " + pathName(r.cat) + " · Kaydet'e bas"); } }
    else toast(hasAI() ? "Başlık bulunamadı" : "Sayfa başlığı alınamadı · akıllı kategoriyi açarsan yapay zekâ yazar");
  };
  $("#eS").onclick = async () => {
    const url = $("#eU").value.trim();
    const n = { ...it, title: $("#eT").value.trim(), url, note: $("#eN").value.trim(), cat: $("#eC").value, platform: platformOf(url).k, tags: cleanTags($("#eG").value.split(",")) };
    if (n.cat !== it.cat) { n.auto = false; learnFrom(n, n.cat); }
    closeSheet(); try { await saveItem(n); toast("Güncellendi"); } catch { toast("Kaydedilemedi"); }
  };
}

/* ---------- Kategori ekle / düzenle ---------- */
$("#btnCats").onclick = openCatManager;
function openCatManager() {
  openSheet(`<h3>🗂️ Kategoriler</h3>
    <p style="margin:-6px 0 8px;color:var(--muted);font-size:13px">Düzenlemek için bir kategoriye dokun.</p>
    <div class="tree">${treeOrder().map(({ c, depth }) =>
      `<button class="opt" data-ec="${esc(c.id)}" style="padding-left:${10 + depth * 26}px">${depth ? '<span style="color:var(--muted)">└</span>' : ""}<span style="font-size:20px">${esc(c.emoji)}</span><span style="flex:1">${esc(c.name)}</span><span style="color:var(--muted);font-size:12px">${countIn(c.id)}</span></button>`).join("")}</div>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <button class="btn sm pri" id="mNew">＋ Yeni kategori</button><button class="btn sm" id="mX">Kapat</button>
    </div>`);
  $("#sheet").querySelectorAll("[data-ec]").forEach(b => b.onclick = () => openCatEdit(b.dataset.ec, null, null, openCatManager));
  $("#mNew").onclick = () => openCatEdit(null, null, null, openCatManager);
  $("#mX").onclick = closeSheet;
}

function openCatEdit(id, parentId = null, onCreated = null, back = null) {
  const isNew = !id;
  const c = isNew ? { id: "c" + uid8(), emoji: "📁", name: "", kw: "", parent: parentId || null } : { ...catById(id) };
  const n = isNew ? 0 : countIn(c.id), subs = isNew ? [] : childrenOf(c.id);
  openSheet(`<h3>${isNew ? (parentId ? "Alt kategori ekle" : "Yeni kategori") : "Kategoriyi düzenle"}</h3>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="row" style="flex-wrap:nowrap">
        <input class="field" id="kE" value="${esc(c.emoji)}" style="width:56px;text-align:center;font-size:20px" maxlength="4">
        <input class="field" id="kN" value="${esc(c.name)}" placeholder="Kategori adı" style="flex:1">
      </div>
      <label style="font-size:13px;color:var(--muted)">Üst kategori</label>
      <select class="field" id="kP">${catOptions(c.parent, { none: true, exclude: isNew ? null : c.id })}</select>
      <label style="font-size:13px;color:var(--muted)">Anahtar kelimeler (otomatik kategori için, virgülle ayır)</label>
      <textarea class="field" id="kK" rows="2" placeholder="pardus, etap, linux">${esc(c.kw || "")}</textarea>
      <div class="row" style="justify-content:space-between;margin-top:4px">
        ${isNew ? "<span></span>" : `<button class="btn sm" id="kD" style="color:var(--acc)">🗑️ Sil</button>`}
        <div class="row"><button class="btn" id="kX">Vazgeç</button><button class="btn pri" id="kS">Kaydet</button></div>
      </div>
      ${!isNew && (n || subs.length) ? `<p style="font-size:12.5px;color:var(--muted);margin:0">Silersen ${n ? n + " kayıt" : ""}${n && subs.length ? " ve " : ""}${subs.length ? subs.length + " alt kategori" : ""} bir üst seviyeye taşınır.</p>` : ""}
    </div>`);
  if ($("#sheet").querySelector("select#kP")) $("#kP").value = c.parent || "";
  if (isNew) setTimeout(() => $("#kN").focus(), 50);
  $("#kX").onclick = () => back ? back() : closeSheet();
  $("#kS").onclick = async () => {
    const name = $("#kN").value.trim();
    if (!name) { toast("Kategori adı yaz"); return; }
    const parent = $("#kP").value || null;
    if (childrenOf(parent).some(x => x.id !== c.id && trLower(x.name) === trLower(name))) { toast("Bu adla bir kategori zaten var"); return; }
    const upd = { ...c, name: name.slice(0, 30), emoji: ($("#kE").value.trim() || "📁").slice(0, 4), parent,
      kw: $("#kK").value.split(",").map(s => s.trim()).filter(Boolean).join(",") };
    if (isNew) {
      if (!parent) { const di = S.cats.findIndex(x => x.id === "diger"); S.cats.splice(di >= 0 ? di : S.cats.length, 0, upd); }
      else S.cats.push(upd);
    } else S.cats = S.cats.map(x => x.id === c.id ? upd : x);
    try {
      await saveCats();
      if (onCreated) await onCreated(upd.id);
      toast(isNew ? "Eklendi: " + pathName(upd.id) : "Kaydedildi");
    } catch { toast("Kaydedilemedi"); }
    back ? back() : closeSheet();
  };
  if (!isNew) $("#kD").onclick = () => {
    const btn = $("#kD");
    if (!btn.dataset.sure) { btn.dataset.sure = "1"; btn.textContent = "Emin misin? Tekrar bas"; return; }
    deleteCat(c.id).then(() => { toast("Silindi"); back ? back() : closeSheet(); });
  };
}

async function deleteCat(id) {
  const c = catById(id);
  const target = c.parent || (id !== "diger" && S.cats.some(x => x.id === "diger") ? "diger" : null);
  for (const ch of childrenOf(id)) ch.parent = c.parent || null;
  S.cats = S.cats.filter(x => x.id !== id);
  let fallback = target;
  if (!fallback) { fallback = "diger"; if (!S.cats.some(x => x.id === "diger")) S.cats.push({ id: "diger", emoji: "📦", name: "Diğer", parent: null, kw: "" }); }
  try {
    await saveCats();
    for (const it of S.items.filter(i => i.cat === id)) await saveItem({ ...it, cat: fallback });
  } catch { toast("Kaydedilemedi"); }
  if (S.sel === id) go(c.parent || "home");
}

/* ---------- Yedek ---------- */
$("#btnExport").onclick = async () => {
  const data = JSON.stringify({ app: "SonraBak", v: VERSION, author: "Mehmet Karadeniz, 2026-2027", cats: S.cats, items: S.items });
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    a.download = "sonrabak-yedek-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    toast(`${S.items.length} kayıt indirildi`); return;
  } catch {}
  try { await navigator.clipboard.writeText(data); toast(`${S.items.length} kayıt panoya kopyalandı`); }
  catch {
    openSheet(`<h3>Yedek</h3><p style="color:var(--muted);font-size:13px">Aşağıdaki metni seçip kopyala ve bir yere kaydet.</p><textarea class="field" style="width:100%" rows="8" readonly>${esc(data)}</textarea>`);
  }
};
$("#btnImport").onclick = () => {
  openSheet(`<h3>Yedek yükle</h3>
    <p style="color:var(--muted);font-size:13px">Yedek metnini yapıştır veya .json dosyası seç. Mevcut kayıtlar silinmez, eklenir.</p>
    <textarea class="field" id="impT" style="width:100%" rows="6" placeholder='{"app":"SonraBak",…}'></textarea>
    <input type="file" id="impF" accept=".json,.txt,application/json" style="margin:8px 0">
    <div class="row" style="justify-content:flex-end"><button class="btn" id="iX">Vazgeç</button><button class="btn pri" id="iS">Yükle</button></div>`);
  $("#impF").onchange = async e => { const f = e.target.files[0]; if (f) $("#impT").value = await f.text(); };
  $("#iX").onclick = closeSheet;
  $("#iS").onclick = async () => {
    let d; try { d = JSON.parse($("#impT").value); } catch { toast("Geçersiz yedek"); return; }
    if (!d || !Array.isArray(d.items)) { toast("Geçersiz yedek"); return; }
    closeSheet();
    if (Array.isArray(d.cats)) {
      for (const c of d.cats) if (c && c.id && !S.cats.some(x => x.id === c.id)) S.cats.push({ id: String(c.id), emoji: String(c.emoji || "📁"), name: String(c.name || "Adsız"), kw: String(c.kw || ""), parent: c.parent ? String(c.parent) : null });
      await saveCats();
    }
    const have = new Set(S.items.map(i => i.id)); let n = 0;
    for (const it of d.items) {
      if (!it || !it.id || have.has(it.id)) continue;
      const clean = { id: String(it.id), url: String(it.url || ""), title: String(it.title || ""), note: String(it.note || ""), platform: platformOf(it.url || "").k, cat: String(it.cat || "diger"), auto: !!it.auto, read: !!it.read, fav: !!it.fav, created: +it.created || Date.now(),
        ...(Array.isArray(it.tags) ? { tags: cleanTags(it.tags) } : {}), ...(it.ozet ? { ozet: String(it.ozet) } : {}), ...(it.tur ? { tur: String(it.tur) } : {}), ...(it.ai ? { ai: true } : {}) };
      try { await saveItem(clean); n++; } catch {}
    }
    toast(n + " kayıt yüklendi");
  };
};

/* ---------- Paylaş menüsünden gelen içerik (share_target) ---------- */
function handleShared() {
  const p = new URLSearchParams(location.search);
  const parts = [p.get("url"), p.get("text"), p.get("title")].filter(Boolean);
  if (!parts.length) return;
  const url = extractUrl(parts.join(" "));
  const text = [p.get("title"), p.get("text")].filter(Boolean).join("\n").replace(url, "").trim();
  $("#inUrl").value = (url ? url + (text ? "\n" + text : "") : text);
  history.replaceState(null, "", location.pathname);
  setTimeout(() => $("#btnSave").click(), 300);
}

/* ---------- Service worker ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

/* ---------- Başlat ---------- */
render();
initCloud();
initSample();
applyHash();
handleShared();
})();
</script>
